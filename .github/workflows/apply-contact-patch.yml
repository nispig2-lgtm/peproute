name: Apply PepRoute contact patch

on:
  push:
    paths:
      - '.github/workflows/apply-contact-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contact links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          replacements = [
              ('https://wa.me/00000000000?text=', 'https://wa.me/18089915730?text='),
              ('@PepRouteIO', '@PepRoute'),
              ('https://t.me/PepRouteIO', 'https://t.me/PepRoute'),
          ]
          for old, new in replacements:
              html = html.replace(old, new)
          path.write_text(html, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-contact-patch.yml
          git commit -m "Update PepRoute contact links"
          git push
